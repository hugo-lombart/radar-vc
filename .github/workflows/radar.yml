name: Mise à jour du radar

on:
  schedule:
    - cron: "17 5,12,17 * * *"   # 3 fois par jour (heures UTC : ~7h, 14h, 19h à Paris)
  workflow_dispatch:              # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]              # redéploie quand tu modifies le site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Récupérer le fond de carte (une seule fois)
        run: |
          mkdir -p data
          [ -s data/world-110m.json ] || curl -sfL https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json -o data/world-110m.json || true

      - name: Collecter les actus et signaux
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/fetch.py

      - name: Sauvegarder les données
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Radar : mise à jour $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4

